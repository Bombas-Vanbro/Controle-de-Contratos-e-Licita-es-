name: Diagnóstico de rede (temporário)

on:
  push:
    paths:
      - '.github/workflows/diagnostico-rede.yml'

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar acesso aos portais das companhias de saneamento
        run: |
          {
            for u in https://licitacoes.sanepar.com.br/SLI11000.aspx \
                     "https://www.casan.com.br/licitacoes/editais-visualiza?licitacao_modalidade_id=&licitacao_ano=&numero_edital=&licitacao_objeto=" \
                     https://www.sanesul.ms.gov.br/licitacao/tipolicitacao/pregaoEletronico ; do
              r=$(curl -s -o /tmp/pag -m 40 --connect-timeout 20 -A 'Mozilla/5.0' -w '%{http_code} em %{time_total}s' "$u" 2>&1) || r="falhou ($r)"
              echo "$u -> $r, $(wc -c < /tmp/pag 2>/dev/null) bytes, desafio cloudflare: $(grep -c 'cf_chl' /tmp/pag 2>/dev/null)"
            done
          } | tee diagnostico-rede.txt
      - name: Salvar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico-rede.txt
          git commit -m "Diagnóstico de rede das companhias de saneamento"
          git pull --rebase
          git push
